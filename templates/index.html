<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>얼룩 인식 모델</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 50px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.6s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      font-weight: 900;
    }

    .subtitle {
      color: #666;
      margin-bottom: 40px;
      font-size: 1.1rem;
    }

    /* Custom file upload */
    .file-upload-wrapper {
      position: relative;
      margin-bottom: 30px;
    }

    input[type="file"] {
      display: none;
    }

    .file-upload-label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      border: 3px dashed #667eea;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
    }

    .file-upload-label:hover {
      border-color: #764ba2;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
      transform: scale(1.02);
    }

    .file-upload-label.has-file {
      border-color: #4caf50;
      background: rgba(76, 175, 80, 0.1);
    }

    .upload-icon {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .upload-text {
      font-size: 1.1rem;
      color: #667eea;
      font-weight: 600;
    }

    /* Submit button */
    button[type="submit"] {
      width: 100%;
      padding: 18px;
      font-size: 1.2rem;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button[type="submit"]:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
    }

    button[type="submit"]:active {
      transform: translateY(-1px);
    }

    /* Image preview */
    .image-preview {
      margin: 30px 0;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    img {
      width: 100%;
      max-width: 400px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      border: 5px solid white;
    }

    /* Results section */
    .result {
      margin-top: 40px;
      padding: 30px;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
      border-radius: 20px;
      animation: slideUp 0.5s ease;
    }

    .result-label {
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 25px;
      color: #333;
    }

    .result-label b {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 2.5rem;
    }

    /* Progress bars */
    .confidence-bars {
      margin-top: 20px;
    }

    .confidence-item {
      margin-bottom: 20px;
    }

    .confidence-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    .confidence-label {
      font-size: 1.1rem;
    }

    .confidence-value {
      font-size: 1.1rem;
      color: #667eea;
    }

    .progress-bar {
      height: 20px;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      border-radius: 10px;
      transition: width 1s ease;
      position: relative;
      overflow: hidden;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .progress-fill {
      background: linear-gradient(90deg, #667eea, #764ba2);
    }

    /* Emoji icons */
    .emoji {
      font-size: 1.5rem;
      margin-right: 8px;
    }

    /* Loading state */
    .loading {
      display: none;
      margin-top: 20px;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      border: 4px solid rgba(102, 126, 234, 0.2);
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ AI 얼룩 분류기</h1>
    <p class="subtitle">커피, 와인, 깨끗한 상태를 AI가 분석합니다</p>
    
    <form action="/predict" method="post" enctype="multipart/form-data" id="uploadForm">
      <div class="file-upload-wrapper">
        <input type="file" name="file" id="fileInput" accept="image/*" required>
        <label for="fileInput" class="file-upload-label" id="fileLabel">
          <div>
            <div class="upload-icon">📸</div>
            <div class="upload-text">이미지를 선택하거나 드래그하세요</div>
          </div>
        </label>
      </div>
      
      <button type="submit">🚀 AI 분석 시작</button>
    </form>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p style="color: #667eea; font-weight: 600;">AI가 이미지를 분석중입니다...</p>
    </div>

    {% if filename %}
    <div class="image-preview">
      <img src="{{ url_for('static', filename=filename) }}" alt="Uploaded Image">
    </div>
    {% endif %}

    {% if result %}
    <div class="result">
      <div class="result-label">
        예측 결과: <b>{{ result.label }}</b>
      </div>
      
      <div class="confidence-bars">
        <div class="confidence-item">
          <div class="confidence-header">
            <span class="confidence-label"><span class="emoji">🧼</span>Clean</span>
            <span class="confidence-value">{{ result.Clean }}</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: {{ result.Clean }}"></div>
          </div>
        </div>

        <div class="confidence-item">
          <div class="confidence-header">
            <span class="confidence-label"><span class="emoji">☕</span>Coffee</span>
            <span class="confidence-value">{{ result.Coffee }}</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: {{ result.Coffee }}"></div>
          </div>
        </div>

        <div class="confidence-item">
          <div class="confidence-header">
            <span class="confidence-label"><span class="emoji">🍷</span>Wine</span>
            <span class="confidence-value">{{ result.Wine }}</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: {{ result.Wine }}"></div>
          </div>
        </div>
      </div>
    </div>
    {% endif %}
  </div>

  <script>
    // File input feedback
    const fileInput = document.getElementById('fileInput');
    const fileLabel = document.getElementById('fileLabel');
    const uploadForm = document.getElementById('uploadForm');
    const loading = document.getElementById('loading');

    fileInput.addEventListener('change', function(e) {
      if (e.target.files.length > 0) {
        const fileName = e.target.files[0].name;
        fileLabel.innerHTML = `
          <div>
            <div class="upload-icon">✅</div>
            <div class="upload-text">${fileName}</div>
          </div>
        `;
        fileLabel.classList.add('has-file');
      }
    });

    // Show loading on submit
    uploadForm.addEventListener('submit', function() {
      loading.classList.add('active');
    });

    // Drag and drop
    fileLabel.addEventListener('dragover', function(e) {
      e.preventDefault();
      this.style.borderColor = '#764ba2';
      this.style.transform = 'scale(1.02)';
    });

    fileLabel.addEventListener('dragleave', function(e) {
      e.preventDefault();
      this.style.borderColor = '#667eea';
      this.style.transform = 'scale(1)';
    });

    fileLabel.addEventListener('drop', function(e) {
      e.preventDefault();
      this.style.borderColor = '#667eea';
      this.style.transform = 'scale(1)';
      
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        fileInput.files = files;
        const fileName = files[0].name;
        this.innerHTML = `
          <div>
            <div class="upload-icon">✅</div>
            <div class="upload-text">${fileName}</div>
          </div>
        `;
        this.classList.add('has-file');
      }
    });
  </script>
</body>
</html>
